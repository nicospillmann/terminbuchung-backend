<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Terminübersicht</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
    }
    .booked {
      background-color: #f2dede;
    }
  </style>
</head>
<body>
  <h1>Alle Termine (Admin-Ansicht)</h1>
  <table id="adminTable">
    <thead>
      <tr>
        <th>Datum/Zeit</th>
        <th>Name</th>
        <th>E-Mail</th>
        <th>Telefon</th>
        <th>Größe</th>
        <th>Gewicht</th>
        <th>Aktion</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="./script.js"></script>
</body>
</html>

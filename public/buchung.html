<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Termin buchen</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    .hidden { display: none; }
    .info-message { color: green; }
    .error-message { color: red; }
  </style>
</head>
<body>
  <h1>Online-Terminbuchung</h1>
  <div id="slotTableContainer">
    <table>
      <thead><tr><th>Datum</th><th>Status</th></tr></thead>
      <tbody id="slotTableBody"></tbody>
    </table>
  </div>

  <div id="calendarContainer" class="hidden"></div>
  <section id="bookingSection" class="hidden">
    <form id="bookingForm">
      <input type="hidden" id="selectedSlotId" />
      <input type="text" id="firstName" placeholder="Vorname" required />
      <input type="text" id="lastName" placeholder="Nachname" required />
      <input type="email" id="email" placeholder="E-Mail" required />
      <input type="text" id="phone" placeholder="Telefonnummer" required />
      <input type="number" id="height" placeholder="Größe (cm)" required />
      <input type="number" id="weight" placeholder="Gewicht (kg)" required />
      <button type="submit">Buchen</button>
    </form>
    <p id="status"></p>
    <button id="backButton">Zurück</button>
  </section>

  <script src="./script.js"></script>
</body>
</html>

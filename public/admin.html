<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adminbereich – Slot hinzufügen</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1>Admin: Neue Slots anlegen</h1>
  <form id="singleSlotForm">
    <label>Datum/Zeit:
      <input type="datetime-local" id="datetimeInput" required />
    </label>
    <button type="submit">Einzelnen Slot hinzufügen</button>
  </form>

  <form id="multiSlotForm">
    <label>Mehrere Daten (durch Komma getrennt):
      <input type="text" id="datetimesInput" placeholder="YYYY-MM-DDTHH:mm, ..." />
    </label>
    <button type="submit">Serien hinzufügen</button>
  </form>

  <script src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminbuchung Tandemsprung</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1>Terminbuchung Tandemsprung</h1>
  <div>
    <button id="toggleTable">Tabelle</button>
    <button id="toggleCalendar">Kalender</button>
  </div>

  <div id="slotTableContainer">
    <table>
      <thead><tr><th>Datum</th><th>Status</th></tr></thead>
      <tbody id="slotTableBody"></tbody>
    </table>
  </div>

  <div id="calendarContainer" class="hidden"></div>

  <section id="bookingSection" class="hidden">
    <h2>Termin buchen</h2>
    <form id="bookingForm">
      <input type="hidden" id="selectedSlotId" />
      <label>Vorname: <input type="text" id="firstName" required /></label><br>
      <label>Nachname: <input type="text" id="lastName" required /></label><br>
      <label>E-Mail: <input type="email" id="email" required /></label><br>
      <label>Telefon: <input type="text" id="phone" required /></label><br>
      <label>Größe (cm): <input type="number" id="height" required /></label><br>
      <label>Gewicht (kg): <input type="number" id="weight" required /></label><br>
      <button type="submit">Buchung abschließen</button>
    </form>
    <p id="status"></p>
    <button id="backButton">Zurück</button>
  </section>

  <script src="./script.js"></script>
</body>
</html>
